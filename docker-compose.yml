services:
  mongo:
    image: mongo:7
    container_name: shipnow-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - shipnow-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { if (rs.status().myState === 1) quit(0); } catch (e) {}
          try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
          catch (e) {}
          quit(1)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  shipnow:
    build:
      context: .
      target: production
    container_name: shipnow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/shipnow?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - shipnow-uploads:/app/uploads
      - shipnow-logs:/app/logs

volumes:
  shipnow-mongo-data:
  shipnow-uploads:
  shipnow-logs:
