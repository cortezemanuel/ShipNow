services:
  shipnow:
    build: .
    container_name: shipnow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
    volumes:
      - shipnow-uploads:/app/uploads

volumes:
  shipnow-uploads:
